# Tier 2: hooks mirror the CI gate so red never reaches a PR.
# Install once with:  uv tool install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(api|evals|research)/
      - id: ruff-format
        files: ^(api|evals|research)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (api, strict)
        entry: bash -c 'cd api && uv run mypy'
        language: system
        pass_filenames: false
        files: ^api/

      - id: biome
        name: biome (web)
        entry: bash -c 'cd web && pnpm exec biome check .'
        language: system
        pass_filenames: false
        files: ^web/
